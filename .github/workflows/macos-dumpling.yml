name: macOS build (dumpling)

# OnePlus 5T (dumpling) kernel + payload build.
# Firmware is built separately by edk2-msm8998/build.sh; this workflow only
# covers the steps that need Xcode (XNU kernel, prelink, payload/ADT).
#
# Run:
#   gh workflow run macos-dumpling.yml -R The-Sunder-islands/UniXNU --ref dumpling-ci \
#     -f device_repository=The-Sunder-islands/UniXNU-dumpling

on:
  workflow_dispatch:
    inputs:
      device_repository:
        description: Device repository as owner/name
        required: true
        default: The-Sunder-islands/UniXNU-dumpling
      device_ref:
        description: Device repository ref
        required: true
        default: main
      ipsw_url:
        description: IPSW URL (empty uses board.toml [ipsw])
        required: false
        default: ""
      build_userdata:
        description: Also build the userdata image
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-dumpling-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  GITHUB_TOKEN: ${{ github.token }}
  UNIXNU_DEVICE: ${{ github.workspace }}/device

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          repository: The-Sunder-islands/UniXNU
          ref: dumpling-ci

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.device_repository }}
          ref: ${{ inputs.device_ref }}
          path: device
          token: ${{ secrets.UNIXNU_DEVICE_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Report the runner toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcode-select -p
          /usr/bin/compression_tool -h >/dev/null 2>&1 && echo 'compression_tool ok' || echo 'compression_tool missing'

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('device/unixnu.lock') }}
          restore-keys: |
            brew-${{ runner.os }}-

      - name: Cache UniXNU source feeds
        uses: actions/cache@v4
        with:
          path: out/dumpling/feeds
          key: dumpling-feeds-${{ hashFiles('device/unixnu.lock', 'feeds.toml') }}
          restore-keys: |
            dumpling-feeds-

      - name: Install host tools
        run: |
          brew install cmake ninja unifdef llvm lld mtools dtc
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"

      - name: Select the device
        run: |
          ./unixnu defconfig dumpling_defconfig -D "$UNIXNU_DEVICE"
          ./unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread \
                          corecrypto-2023 IOStorageFamily -D "$UNIXNU_DEVICE"

      - name: Prepare Data skeleton
        run: |
          set -euo pipefail
          python3 scripts/prepare-owner-data-fixture.py --skeleton --size-mib 4096 --packed \
            --output build/owner-data-fixture
          uuid="$(python3 -c 'import json; print(json.load(open("build/owner-data-fixture/seed.json"))["volume_uuid"])')"
          test -n "$uuid"
          echo "XNU_OWNER_DATA_VOLUME_UUID=$uuid" >> "$GITHUB_ENV"
          ls -lh build/owner-data-fixture

      - name: Reset cached XNU worktree
        run: rm -rf out/dumpling/tree

      - name: Build kernel (bootstrap pass, PMGR stub)
        env:
          IPSW_URL: ${{ inputs.ipsw_url }}
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
          XNU_OWNER_DATA_VOLATILE: 1
          XNU_OWNER_BOOT_MANIFEST: 0
          XNU_BRINGUP_CACHE_MOUNT: 1
        run: |
          args=()
          if [ -n "$IPSW_URL" ]; then args+=(--ipsw "$IPSW_URL"); fi
          ./unixnu build kernel "${args[@]}" -D "$UNIXNU_DEVICE"

      - name: Build kernel (real PMGR pass)
        env:
          IPSW_URL: ${{ inputs.ipsw_url }}
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
          XNU_OWNER_DATA_VOLATILE: 1
          XNU_OWNER_BOOT_MANIFEST: 0
          XNU_BRINGUP_CACHE_MOUNT: 1
        run: |
          # The first pass produced out/dumpling/kernel/kernel.macho.  The
          # second pass rebuilds the PMGR archive against its ApplePMGR
          # vtable, relinks the kernel and prelinks again.
          args=()
          if [ -n "$IPSW_URL" ]; then args+=(--ipsw "$IPSW_URL"); fi
          ./unixnu build kernel "${args[@]}" -D "$UNIXNU_DEVICE"

      - name: Debug XNU patch source
        if: always()
        run: |
          find out/dumpling/tree -path '*xnu-work/bsd/kern/kern_exec.c' -print 2>/dev/null || true
          for log in out/dumpling/logs/kernel.log out/dumpling/logs/kernel-bootstrap.log; do
            if [ -f "$log" ]; then
              echo "== $log"
              grep -nE 'error:|#error|Undefined symbols|ld: |redefined' "$log" | tail -40 || true
            fi
          done

      - name: Build payload
        env:
          UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          args=()
          if [ -f "$RUNNER_TEMP/trustcache" ]; then args+=(--trust-cache "$RUNNER_TEMP/trustcache"); fi
          if [ -n "$UNIQUE_CHIP_ID" ]; then args+=(--unique-chip-id "$UNIQUE_CHIP_ID"); fi
          # First kernel bring-up: no Data seed yet.  Add --data-ramdisk once
          # the UFS/APFS root stage is ready.
          ./unixnu build payload "${args[@]}" -D "$UNIXNU_DEVICE"

      - name: Build userdata
        if: inputs.build_userdata
        env:
          IPSW_URL: ${{ inputs.ipsw_url }}
        run: |
          args=()
          if [ -n "$IPSW_URL" ]; then args+=(--ipsw "$IPSW_URL"); fi
          ./unixnu build userdata "${args[@]}" -D "$UNIXNU_DEVICE"

      - name: Split userdata image for artifact transport
        if: inputs.build_userdata
        run: |
          cd out/dumpling/userdata
          test -f userdata-root.img
          shasum -a 256 userdata-root.img > userdata-root.img.sha256
          cat userdata-root.img.sha256
          split -b 1992294400 userdata-root.img userdata-root.img.part.
          ls -lh userdata-root.img.part.*

      - name: Summarise the artifacts
        if: always()
        run: |
          {
            echo '## dumpling build'
            echo
            echo '```'
            find out/dumpling -type f \( -name '*.json' -o -name '*.img' -o -name '*.macho' -o -name '*.adt' \) 2>/dev/null | sort | while IFS= read -r f; do ls -lh "$f"; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload kernel and payload
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-dumpling
          path: |
            out/dumpling/kernel/**
            out/dumpling/payload/**
            out/dumpling/logs/**
            build/owner-data-fixture/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload userdata parts
        if: inputs.build_userdata
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-dumpling-userdata
          path: |
            out/dumpling/userdata/userdata-root.json
            out/dumpling/userdata/userdata-root.img.sha256
            out/dumpling/userdata/userdata-root.img.part.*
          if-no-files-found: error
          retention-days: 7

      - name: Remove proprietary inputs
        if: always()
        run: |
          # Keep out/dumpling/feeds for the source cache; it contains only
          # open-source git clones.  Remove IPSW/KernelCache and device firmware.
          rm -rf out/dumpling/ipsw device/.cache/firmware out/dumpling/tree/.cache/firmware
          rm -f "$RUNNER_TEMP/trustcache"
