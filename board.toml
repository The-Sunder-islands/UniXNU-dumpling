# Board description of the OnePlus 5T (dumpling, MSM8998), read by the unixnu build driver.
#
# The firmware is *not* built by "unixnu build firmware": B line decision D6/D7 keeps
# edk2-msm8998/build.sh (GCC5, its own DSC/FDF) and packages the image with this
# repository's scripts/make-bootimg.py.  See README.md.

[board]
name = "dumpling"
soc = "MSM8998"
description = "OnePlus 5T"
kit = "dumpling"

# Route target: the unchanged iPad7,1 iPadOS 17.7.11 restore image. This is the
# only OS profile used by the port; there is no second identity switch.
[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

# Measured on the OnePlus 5T on 2026-11-09 from the Android-side GPT:
# LUN0 has 29,765,632 logical blocks of 4096 bytes; userdata is
# 29,679,803 blocks = 121,568,473,088 bytes = 115,936.73 MiB.
# first_lba = 0x14F40, last_lba = 0x1C62FFA.
#
# The OnePlus 5 reference was last_lba = 0x1C627FA (2,048 blocks less);
# do not copy the cheeseburger value.
[userdata]
first_lba = 0x14f40
last_lba = 0x1c62ffa
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "dumpling_defconfig"

# Archive builders, in order.  NativeUfs, NativeAdreno and the PMGR work belong to B5/B7.
# The first B3 kernel needs the platform expert, timer and the block fixtures.  The kernel
# console does not need the legacy display kit: DarwinBoot passes the GOP frame buffer in
# boot_args->Video.  sheng's build-native-legacy-display.py / build-boot-progress.py are tied
# to its GPU/touch/backlight probes and are a B7 (IOMobileFramebuffer) task.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-arm-driver.py NativeAES",
  "build-arm-driver.py NativeVirtioBlock",
  "build-arm-driver.py NativeRamBlock",
  # B5: the UFS probe pulls in GPU/RamBlock symbols; not needed for B3.
  # "build-arm-driver.py NativeUfsProbe",
  # B5: requires signed VerifiedRoot policies (build/verified-root-os/*).
  # Not needed for the first B3 kernel boot; re-enable at the UFS/APFS stage.
  # "build-native-ufs-runtime.py",
  # B3: the real ApplePMGR provider needs the prelinked kernel.macho.  The
  # script falls back to the stub on the first pass; the CI runs "build
  # kernel" a second time after the prelink to build the real archive.
  "build-sheng-pmgr.py",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
]

[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
# kernelcache_sha256 = "..."        # TODO(B3): fill from the fetched iPad7,1 17.7.11 KernelCache
# B3: the original coalesced prelink ranges must sit above
# VM_KERNEL_LINK_ADDRESS (__TEXT) for arm_vm_prot_init.  The sheng -0x1000000
# slide put __PRELINK_TEXT 0x2d88000 below __TEXT; 0x4100000 lifts the whole
# prelink set above the native __LINKEDIT (0x82ec000) instead.
slide = "0x5000000"
# Run the original AMFI early-security initializer so dyld's
# amfi_check_dyld_policy_self path is initialized.
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
# Start from the sheng roots, then drop the ones that assume an Apple PMGR, UFS controller or
# Adreno: B4 owns that pruning.  TODO(B3): tune against the first panic.
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
  # B7: the original Legacy framebuffer and its IOSurface/IOAV dependencies.
  "com.apple.iokit.IOMobileGraphicsFamily",
  # H103fo: IOGPUFamily supplies IOAcceleratorES for the A540 stub.
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
]

# The ramdisk of the boot image: a FAT volume with the UniXNU config, the kernel and its
# device tree.  The loader (DarwinBoot) stays in the firmware volume.
[payload]
volume = "OP5TESP"
size_mib = 76
loader = "firmware"
title = "OnePlus 5T B1"
# Measured 2026-11-09: 8 GB variant.  Android MemTotal 7,902,276 kB;
# DumplingInfo.efi reports 7839 MiB visible to UEFI in 51 descriptors.
dram_size = "0x200000000"
panic_screen = false                # H67: skip fixed panic cave; use kernel console
kernel_args = [
  "-v",
  # DinnerABC's successful iPadOS 17.7.11 baseline runs a single CPU.
  "cpus=1",
  "debug=0x14e",
  "boot-progress=2",
  "offline-legacy-gop=1",
  "offline-legacy-unit-scale=1",
  "native-ufs-probe=0",
  # sheng bring-up policy: disable watchdogd and the known XPC/crash-loop
  # launch daemons before launchd exec.
  "sheng-disable-watchdogd=1",
  "sheng-lite=1",
  # Diagnostic H82l: keep the launchd core from scrolling the console and
  # from spending two minutes on a 256 MiB Data volume.
  "native-skip-coredump=1",
  # Temporary B5 bring-up only: allow the unsealed iPad restore root to reach
  # launchd/AMFI. Remove this once VerifiedRoot is wired.
  "native-skip-root-auth=1",
  # Diagnostic only: launchd was rejected with OS_REASON_EXEC /
  # EXEC_EXIT_REASON_SECURITY_POLICY. Restore real AMFI/VerifiedRoot later.
  "amfi_get_out_of_my_way=1",
  "amfi=0x94",
  "amfi_allow_any_signature=1",
  "cs_enforcement_disable=1",
  "native-skip-exec-signature=1",
  "launchd_unsecure_cache=1",
  # QEMU/iPadOS17 bring-up: testMode + skip ignition, so DYLD_AMFI_FAKE is
  # honored and the fallback SystemOS cache can be used.
  "dyld_flags=0x0000008A",
  # Temporary H81: -1 falls back to max_task_footprint; 0 removes the global
  # per-task cap so the private cache cannot trigger per-process jetsam.
  "max_task_pmem=0",
  "-apfs_shared_datavolume",
]

[payload.adt]
tool = "scripts/make-dumpling-adt.py"
# The generator builds the tree from the pinned MSM8998 constants (GICD 0x17a00000,
# GICR 0x17b00000 stride 0x20000, timebase 19200000, UFS qcom,msm8998-ufshc), measured
# by scripts/check-adt.py.  The /product and /buttons nodes follow the iPad7,1
# route identity.
cpu_regs = "0,1,2,3,0x100,0x101,0x102,0x103"
psci_method = "smc"
# 3.75 GiB DarwinBoot window.  The first 4 GiB attempt failed: DarwinBoot
# reported "NO WINDOW 100000000" and the largest free run was 0xFCCC0000
# (~3.95 GiB) at 0x180000000.  0xF0000000 fits with headroom.
owned_memory_size = "0xF0000000"
ipad_identity = true
# Packed DBRDISK1 Data seed: the logical Data disk is larger than the payload
# file, so core dumps and launchd state do not exhaust a small raw seed.
packed_data_ramdisk = true
# Root selection: the OS window's APFS volume UUID in the iPad7,1 fixture.
# This is read-only root media; Data is a separate later task.
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
